[workspace]

[package]
name = "petpet-rs"
version = "2.0.0"
edition = "2021"
description = "128x128 Animated WebP (24-bit + Alpha) PetPet generator in Rust (Cloudflare Workers & Standalone HTTP Server)"
repository = "https://github.com/UWblNSKPRIME/petpet-rs"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
zenwebp = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
once_cell = "1.20"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["limit", "buffer", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_yaml = "0.9"
humantime-serde = "1.1"
lru = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rust-s3 = { version = "0.35", default-features = false, features = ["tokio-rustls-tls"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = "1.7"
async-trait = "0.1"
